## 架构决策记录
architecture_decisions:
  - decision: "使用 Composition API 而非 Options API"
    reason: "更好的 TypeScript 支持和逻辑复用"
  
  - decision: "多语言文案内置在 Composable 中"
    reason: "减少外部依赖，简化集成复杂度"
  
  - decision: "使用 Tailwind CSS 而非 CSS Modules"
    reason: "与项目现有技术栈保持一致"
  
  - decision: "支持 Props 覆盖默认文案"
    reason: "提高组件的灵活性和可定制性"

