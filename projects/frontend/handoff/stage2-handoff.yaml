  props_interface: "WelcomeBannerProps"
  composable_function: "useWelcomeBanner"
  locale_interface: "WelcomeBannerLocale"
  config_interface: "WelcomeBannerConfig"

## 组件依赖关系
dependencies:
  internal:
    - "@/types/components"
    - "@/composables/useWelcomeBanner"
    - "@/locales/*"
  external:
    - "vue (^3.5.27)"
    - "tailwindcss (^4.1.18)"
    - "element-plus (^2.13.2)"

## 响应式设计规范
responsive_design:
  breakpoints:
    mobile: "< 768px"
    tablet: "768px - 1023px"
    desktop: ">= 1024px"
  
  layout_strategy: "移动优先，渐进增强"
  
  key_adjustments:
    - "字体大小：移动端 text-3xl，桌面端 text-4xl"
    - "内边距：移动端 py-8 px-4，桌面端 py-12 px-8"
    - "容器最大宽度：max-w-4xl"

## 多语言支持
i18n_implementation:
  supported_languages: ["en", "hi", "id"]
  implementation_strategy: "Composable 内置文案 + Props 覆盖"
  fallback_language: "en"
  
  text_keys:
    - "welcome_title"
    - "welcome_subtitle"

## 性能要求
performance_requirements:
